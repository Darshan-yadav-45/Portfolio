[build]
  base = "."
  publish = "."
  command = "echo 'No build required'"

[[redirects]]
  from = "/"
  to = "/frontend/pages/index.html"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/frontend/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/frontend/js/:splat"
  status = 200

[[redirects]]
  from = "/public/*"
  to = "/frontend/public/:splat"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/admin/pages/login.html"
  status = 200

[[redirects]]
  from = "/admin/dashboard"
  to = "/admin/pages/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/pages/login.html"
  status = 301

[[redirects]]
  from = "/admin/css/*"
  to = "/admin/css/:splat"
  status = 200

[[redirects]]
  from = "/admin/js/*"
  to = "/admin/js/:splat"
  status = 200

[[redirects]]
  from = "/*.html"
  to = "/frontend/pages/:splat.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR_RENDER_BACKEND_URL.onrender.com/uploads/:splat"
  status = 200
  force = true
