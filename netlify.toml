[build]
  base = "."
  publish = "."
  command = "echo 'No build required'"

[[redirects]]
  from = "/"
  to = "/frontend/pages/index.html"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/frontend/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/frontend/js/:splat"
  status = 200

[[redirects]]
  from = "/public/*"
  to = "/frontend/public/:splat"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/admin/pages/login.html"
  status = 200

[[redirects]]
  from = "/admin/dashboard"
  to = "/admin/pages/dashboard.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/pages/login.html"
  status = 301

[[redirects]]
  from = "/admin/css/*"
  to = "/admin/css/:splat"
  status = 200

[[redirects]]
  from = "/admin/js/*"
  to = "/admin/js/:splat"
  status = 200

[[redirects]]
  from = "/about.html"
  to = "/frontend/pages/about.html"
  status = 200

[[redirects]]
  from = "/projects.html"
  to = "/frontend/pages/projects.html"
  status = 200

[[redirects]]
  from = "/project-details.html"
  to = "/frontend/pages/project-details.html"
  status = 200

[[redirects]]
  from = "/project-request.html"
  to = "/frontend/pages/project-request.html"
  status = 200

[[redirects]]
  from = "/skills.html"
  to = "/frontend/pages/skills.html"
  status = 200

[[redirects]]
  from = "/education.html"
  to = "/frontend/pages/education.html"
  status = 200

[[redirects]]
  from = "/contact.html"
  to = "/frontend/pages/contact.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/frontend/pages/login.html"
  status = 200

[[redirects]]
  from = "/register.html"
  to = "/frontend/pages/register.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR_RENDER_BACKEND_URL.onrender.com/uploads/:splat"
  status = 200
  force = true
