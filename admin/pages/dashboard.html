<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body style="background: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif;">
    
    <nav class="navbar" style="border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div class="logo">ADMIN DASHBOARD</div>
        <div class="nav-links">
            <a href="#" id="nav-projects" class="active" onclick="switchTab('projects'); return false;">Projects</a>
            <a href="#" id="nav-messages" onclick="switchTab('messages'); return false;">Messages</a>
            <a href="/" target="_blank">View Live Site ↗</a>
        </div>
        <button onclick="logoutAdmin()" class="btn-text" style="color: #ff4b4b;">Logout</button>
    </nav>

    <main style="padding: 100px 5% 50px 5%; max-width: 1400px; margin: 0 auto;">
        
        <!-- Projects Section -->
        <section id="section-projects">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 style="font-family: 'Anton', sans-serif; font-size: 2.5rem; letter-spacing: 1px;">PROJECT MANAGEMENT</h1>
                <button class="btn-primary" onclick="openProjectModal()">+ Add Project</button>
            </div>

            <div class="glass" style="padding: 0; overflow-x: auto; border-radius: 12px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);">
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500;">Project</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500;">Category</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500;">Status</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500;">Order</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500; text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projects-table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Messages Section -->
        <section id="section-messages" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1 style="font-family: 'Anton', sans-serif; font-size: 2.5rem; letter-spacing: 1px;">CONTACT MESSAGES</h1>
            </div>

            <div class="glass" style="padding: 0; overflow-x: auto; border-radius: 12px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);">
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500; width: 15%;">Date</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500; width: 20%;">From</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500; width: 20%;">Subject</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500; width: 30%;">Message</th>
                            <th style="padding: 1.5rem 1rem; color: var(--text-muted); font-weight: 500; text-align: right; width: 15%;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="messages-table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Modal for Add/Edit Project -->
    <div id="project-modal" class="modal-overlay">
        <div class="modal-content glass">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2 id="modal-title" style="font-family: 'Anton', sans-serif;">Add Project</h2>
                <button onclick="closeProjectModal()" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>

            <form id="project-form" enctype="multipart/form-data">
                <input type="hidden" id="project-id">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Project Title *</label>
                        <input type="text" id="title" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Category *</label>
                        <input type="text" id="category" placeholder="e.g. Full Stack Development" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Short Description</label>
                        <textarea id="short_description" rows="3"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Detailed Description</label>
                        <textarea id="detailed_description" rows="5"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Project Image *</label>
                        <input type="file" id="image" accept="image/jpeg, image/png, image/webp">
                        <div id="current-image-preview" style="margin-top: 0.5rem; display: none;">
                            <img id="preview-img" src="" style="max-height: 100px; border-radius: 8px;">
                            <p style="font-size: 0.8rem; color: var(--text-muted);">Current Image (Upload new to replace)</p>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label>Technologies (Comma separated)</label>
                        <input type="text" id="technologies" placeholder="React, Node.js, Python">
                    </div>

                    <div class="form-group full-width">
                        <label>Features (One per line)</label>
                        <textarea id="features" rows="4" placeholder="- Data cleaning&#10;- Interactive charts"></textarea>
                    </div>

                    <div class="form-group">
                        <label>GitHub URL</label>
                        <input type="url" id="github_url" placeholder="https://github.com/...">
                    </div>

                    <div class="form-group">
                        <label>Live Demo URL</label>
                        <input type="url" id="live_demo_url" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label>Display Order</label>
                        <input type="number" id="display_order" value="0">
                    </div>

                    <div class="form-group flex-row">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="published" checked>
                            Published (Visible on site)
                        </label>
                    </div>
                    
                    <div class="form-group flex-row">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="featured">
                            Featured Project
                        </label>
                    </div>
                </div>

                <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn-text" onclick="closeProjectModal()">Cancel</button>
                    <button type="submit" class="btn-primary" id="save-btn">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/js/admin.js"></script>
    <script>
        // Check Auth
        if (!localStorage.getItem('admin_token')) {
            window.location.href = '/frontend/pages/login.html';
        } else {
            fetchAdminProjects();
        }
    </script>
</body>
</html>
