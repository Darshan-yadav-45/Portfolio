    <style>
        .project-hero {
            padding: 8rem 0 4rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .project-hero h1 {
            font-family: 'Anton', sans-serif;
            font-size: 4rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .project-tags {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .project-cover {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 4rem;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .project-cover img {
            width: 100%;
            height: auto;
            display: block;
        }
        .project-content {
            max-width: 800px;
            margin: 0 auto 6rem;
            font-size: 1.2rem;
            line-height: 1.8;
            color: #d0d0d0;
        }
        .project-content h2 {
            color: #fff;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            font-family: 'Anton', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        .project-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 4rem;
            padding: 2rem;
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }
        .meta-item h4 {
            color: var(--primary);
            margin: 0 0 0.5rem 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .meta-item p {
            margin: 0;
            color: #fff;
            font-weight: 500;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            margin-bottom: 2rem;
            font-weight: 500;
            transition: transform 0.3s ease;
        }
        .back-link:hover {
            transform: translateX(-5px);
        }
        
        @media (max-width: 768px) {
            .project-meta {
                grid-template-columns: 1fr;
            }
            .project-hero h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>

    </main>

    <script src="/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            const container = document.getElementById('project-details-container');

            try {
                // Fetch all projects (or specific one if backend supported GET /projects/id)
                const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? (window.location.port === '80' || window.location.port === '8080' ? '/api' : 'http://localhost:8000/api') : '/api';
                const res = await fetch(`${API_BASE}/projects`);
                if (res.ok) {
                    const projects = await res.json();
                    const project = projects.find(p => p.id == projectId);

                    if (project) {
                        const tagsArray = project.tags.split(',').map(t => t.trim());
                        const tagsHtml = tagsArray.map(tag => `<span class="tag">${tag}</span>`).join('');
                        
                        let imgUrl = project.image_url ? `${project.image_url}` : 'https://images.unsplash.com/photo-1498050108023-c5249f4df085';

                        let metaHtml = '';
                        if (project.github_link) {
                            metaHtml += `<div class="meta-item"><h4>GitHub</h4><p><a href="${project.github_link}" target="_blank" style="color:#fff; text-decoration:underline;">View Source</a></p></div>`;
                        }
                        if (project.live_link) {
                            metaHtml += `<div class="meta-item"><h4>Live Project</h4><p><a href="${project.live_link}" target="_blank" style="color:#fff; text-decoration:underline;">Visit Site</a></p></div>`;
                        }

                        // Add placeholder meta if empty
                        if (!metaHtml) {
                            metaHtml = `
                                <div class="meta-item">
                                    <h4>Role</h4>
                                    <p>Developer</p>
                                </div>
                                <div class="meta-item">
                                    <h4>Timeline</h4>
                                    <p>Ongoing</p>
                                </div>
                            `;
                        }

                        container.innerHTML = `
                            <section class="project-hero">
                                <h1>${project.title}</h1>
                                <div class="project-tags">
                                    ${tagsHtml}
                                </div>
                            </section>

                            <div class="project-cover">
                                <img src="${imgUrl}" alt="${project.title}">
                            </div>

                            <div class="project-content">
                                <div class="project-meta">
                                    ${metaHtml}
                                </div>

                                <h2>Project Overview</h2>
                                <p>${project.description}</p>
                                
                                ${project.details ? `<h2>Details</h2><p style="white-space: pre-line;">${project.details}</p>` : ''}
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <section class="project-hero">
                                <h1>Project Not Found</h1>
                                <p>The project you are looking for does not exist.</p>
                            </section>
                        `;
                    }
                }
            } catch (e) {
                console.error("Failed to load project details", e);
                container.innerHTML = `
                    <section class="project-hero">
                        <h1>Error</h1>
                        <p>Could not load project details. Please try again later.</p>
                    </section>
                `;
            }
        });
    </script>
</body>
