<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DARSHAN K M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background-image: url('/public/images/login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .scroll-container {
            display: none;
        }
        .auth-container {
            width: 90%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 3rem 2rem;
            border-radius: 20px;
            max-width: 400px;
            margin: 4rem auto;
            text-align: center;
        }
        .auth-container h2 {
            font-family: 'Anton', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }
        .auth-form input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .auth-form button {
            width: 100%;
            justify-content: center;
            font-size: 1.1rem;
        }
        .auth-links {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-links a {
            color: var(--primary);
            text-decoration: underline;
        }
        #login-error {
            color: #e53935;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <canvas id="hero-lightpass"></canvas>
    </div>

    <main class="content-overlay">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo"><a href="index.html">DARSHAN K M</a></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="education.html">Education</a>
                <a href="contact.html">Contact</a>
            </div>
            
            <button id="auth-btn" class="btn-primary" style="display: flex; align-items: center; gap: 8px; border: none; font-family: inherit; cursor: pointer; font-size: 14px;">
                <span id="auth-text"> Login</span>
            </button>
        </nav>

        <section class="auth-section">
            <div class="auth-container">
                <h2>Welcome Back</h2>
                <p id="login-error">Invalid username or password</p>
                <form id="login-form" class="auth-form">
                    <input type="text" id="username" placeholder="Email Address" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <div class="auth-links">
                    Don't have an account? <a href="register.html">Create one here</a>.
                </div>
            </div>
        </section>

    </main>

    <script src="/js/script.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const loginError = document.getElementById('login-error');

            // If already logged in, redirect to contact
            if (localStorage.getItem('user_token')) {
                window.location.href = 'contact.html';
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    const res = await fetch((window.API_BASE || '/api') + '/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email: username, password: password })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        localStorage.setItem('role', data.user.role);
                        if (data.user.role === 'admin') {
                            localStorage.setItem('admin_token', data.token);
                            window.location.href = '/admin/pages/dashboard.html';
                        } else {
                            localStorage.setItem('user_token', data.token);
                            localStorage.setItem('username', username);
                            window.location.href = 'contact.html';
                        }
                    } else {
                        const data = await res.json();
                        loginError.textContent = data.detail || 'Invalid email or password.';
                        loginError.style.display = 'block';
                    }
                } catch (err) {
                    console.error(err);
                    loginError.style.display = 'block';
                    loginError.textContent = 'Server error. Please try again later.';
                }
            });
        });
    </script>
</body>
</html>
