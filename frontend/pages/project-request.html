<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Request - DARSHAN K M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background-image: url('/public/images/About.jpg'); /* Or any cool background */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .scroll-container {
            display: none;
        }
        .form-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 3rem 2rem;
            border-radius: 20px;
            max-width: 600px;
            margin: 4rem auto;
            text-align: left;
        }
        .form-container h2 {
            font-family: 'Anton', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            text-align: center;
        }
        .form-container p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .custom-form .form-group {
            margin-bottom: 1.5rem;
        }
        .custom-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #ddd;
        }
        .custom-form input[type="text"],
        .custom-form select,
        .custom-form textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .custom-form input:focus,
        .custom-form select:focus,
        .custom-form textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .custom-form select {
            appearance: none;
            cursor: pointer;
        }
        .custom-form textarea {
            resize: vertical;
            min-height: 120px;
        }
        .custom-form button {
            width: 100%;
            justify-content: center;
            font-size: 1.1rem;
            margin-top: 1rem;
        }
        #form-error {
            color: #e53935;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
        #form-success {
            color: #4caf50;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="content-overlay">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo"><a href="index.html">DARSHAN K M</a></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="skills.html">Skills</a>
                <a href="projects.html">Projects</a>
                <a href="education.html">Education</a>
                <a href="contact.html">Contact</a>
            </div>
            
            <button id="auth-btn" class="btn-primary" style="display: flex; align-items: center; gap: 8px; border: none; font-family: inherit; cursor: pointer; font-size: 14px;">
                <span id="auth-text"> Login</span>
            </button>
        </nav>

        <section class="auth-section">
            <div class="form-container">
                <h2>Project Requirements</h2>
                <p class="subtitle">Tell us about the project you'd like to start.</p>
                
                <p id="form-error">An error occurred.</p>
                <p id="form-success">Project request submitted successfully! We'll be in touch soon.</p>
                
                <form id="project-request-form" class="custom-form">
                    <div class="form-group">
                        <label for="project-type">Type of Project *</label>
                        <select id="project-type" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Data Analytics">Data Analytics</option>
                            <option value="Machine Learning">Machine Learning (ML)</option>
                            <option value="Mobile App Development">Mobile App Development (MAD)</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Project Description *</label>
                        <textarea id="description" placeholder="Describe the core features, goals, and any other requirements..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="timeline">Expected Timeline</label>
                        <select id="timeline">
                            <option value="Flexible">Flexible</option>
                            <option value="Less than 1 month">Less than 1 month</option>
                            <option value="1 - 3 months">1 - 3 months</option>
                            <option value="3 - 6 months">3 - 6 months</option>
                            <option value="6+ months">6+ months</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="budget">Estimated Budget</label>
                        <input type="text" id="budget" placeholder="e.g., $1000 - $5000 (Optional)">
                    </div>

                    <button type="submit" class="btn-primary">Submit Request</button>
                </form>
            </div>
        </section>
    </main>

    <script src="/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('user_token');
            if (!token) {
                // Not logged in, redirect to login
                window.location.href = 'login.html';
                return;
            }

            const form = document.getElementById('project-request-form');
            const formError = document.getElementById('form-error');
            const formSuccess = document.getElementById('form-success');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const projectType = document.getElementById('project-type').value;
                const description = document.getElementById('description').value;
                const timeline = document.getElementById('timeline').value;
                const budget = document.getElementById('budget').value;

                try {
                    const res = await fetch('/api/project-requests', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ 
                            project_type: projectType,
                            description: description,
                            timeline: timeline,
                            budget: budget
                        })
                    });

                    if (res.ok) {
                        formError.style.display = 'none';
                        formSuccess.style.display = 'block';
                        form.reset();
                    } else {
                        const data = await res.json();
                        formError.textContent = data.detail || 'Failed to submit request.';
                        formError.style.display = 'block';
                    }
                } catch (err) {
                    console.error(err);
                    formError.textContent = 'Server error. Please try again later.';
                    formError.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
