    <style>
        .contact-container {
            width: 100%;
            background: var(--glass-bg, rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            border-radius: 16px;
            padding: 3rem;
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        @media (max-width: 800px) {
            .contact-container {
                grid-template-columns: 1fr;
                padding: 2rem;
                gap: 2.5rem;
            }
        }

        .contact-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-label {
            color: #4a8bfa;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
        }

        .contact-label::after {
            content: '';
            display: inline-block;
            width: 1px;
            height: 16px;
            background-color: #4a8bfa;
            margin-left: 8px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .contact-title {
            font-size: 3.2rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.5px;
        }

        .contact-desc {
            color: #a0a5b8;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 90%;
        }

        .contact-email {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4a8bfa;
            font-weight: 500;
            text-decoration: none;
            font-size: 1.05rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            justify-content: center;
        }

        .form-row {
            display: flex;
            gap: 1.2rem;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }
        }

        .contact-input {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            color: white;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.3s, background 0.3s;
        }

        .contact-input:focus {
            outline: none;
            border-color: var(--primary, #4a8bfa);
            background: rgba(0, 0, 0, 0.7);
        }

        .contact-input::placeholder {
            color: #5a6078;
        }

        .btn-submit {
            background: var(--primary, #4a8bfa);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
            transition: opacity 0.3s, transform 0.2s;
            font-family: inherit;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>

    <script src="/js/script.js?v=3"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('contact-form');
            const statusBox = document.getElementById('form-status');
            const submitBtn = document.getElementById('submit-btn');
            const submitText = document.getElementById('submit-text');
            const submitIcon = document.getElementById('submit-icon');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Reset status box
                statusBox.style.display = 'none';
                statusBox.className = '';
                
                // Get values
                const name = document.getElementById('contact-name').value.trim();
                const email = document.getElementById('contact-email').value.trim();
                const subject = document.getElementById('contact-subject').value.trim();
                const message = document.getElementById('contact-message').value.trim();

                // Frontend validation
                if (!name || !email || !message) {
                    showStatus('Please fill in all required fields.', 'error');
                    return;
                }

                // UI Loading state
                submitBtn.disabled = true;
                submitText.textContent = 'Sending...';
                submitBtn.style.opacity = '0.7';

                try {
                    const response = await fetch((window.API_BASE || '/api') + '/contact', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ name, email, subject, message })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Something went wrong. Please check your internet connection and try again.');
                    }

                    // Success
                    showStatus('<strong>Message Sent Successfully! 🎉</strong>', 'success');
                    form.reset();

                } catch (error) {
                    // It can be a network error or a specific API error
                    let errorMsg = error.message;
                    if (errorMsg === 'Failed to fetch') {
                        errorMsg = 'Something went wrong. Please check your internet connection and try again.';
                    }
                    showStatus(errorMsg, 'error');
                } finally {
                    // Restore UI state
                    submitBtn.disabled = false;
                    submitText.textContent = 'Send Message';
                    submitBtn.style.opacity = '1';
                }
            });

            function showStatus(msg, type) {
                statusBox.innerHTML = msg;
                statusBox.style.display = 'block';
                if (type === 'success') {
                    statusBox.style.backgroundColor = 'rgba(74, 222, 128, 0.1)';
                    statusBox.style.color = '#4ade80';
                    statusBox.style.border = '1px solid rgba(74, 222, 128, 0.2)';
                } else {
                    statusBox.style.backgroundColor = 'rgba(248, 113, 113, 0.1)';
                    statusBox.style.color = '#f87171';
                    statusBox.style.border = '1px solid rgba(248, 113, 113, 0.2)';
                }
            }
        });
    </script>
