server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend HTML Pages
    location / {
        root /usr/share/nginx/html/frontend/pages;
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Frontend CSS
    location /css/ {
        alias /usr/share/nginx/html/frontend/css/;
    }

    # Frontend JS
    location /js/ {
        alias /usr/share/nginx/html/frontend/js/;
    }

    # Frontend Public Assets
    location /public/ {
        alias /usr/share/nginx/html/frontend/public/;
    }

    # Specific Admin routing exactly like old
    location = /admin/login {
        try_files /admin/pages/login.html =404;
    }
    location = /admin/dashboard {
        try_files /admin/pages/dashboard.html =404;
    }
    location = /admin/ {
        return 301 /admin/login;
    }

    # Admin CSS
    location /admin/css/ {
        alias /usr/share/nginx/html/admin/css/;
    }

    # Admin JS
    location /admin/js/ {
        alias /usr/share/nginx/html/admin/js/;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploads
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
